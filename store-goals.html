  .appbar h1{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar .sub{font-size:.72rem;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .screen{flex:1;padding:16px 16px 30px;animation:slidein .22s ease}
  @keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .livebar{display:flex;align-items:center;gap:7px;justify-content:center;font-size:.72rem;color:var(--muted);padding:4px 0 12px}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* hero header */
  .ghead{background:var(--grad);color:#fff;border-radius:18px;padding:18px 18px 20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(30,58,138,.25)}
  .ghead .kick{font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
  .ghead h2{font-size:1.55rem;margin:3px 0 2px;font-weight:800}
  .ghead .who{font-size:.82rem;opacity:.92}
  .ghead .bigwrap{display:flex;align-items:flex-end;gap:12px;margin-top:14px}
  .ghead .big{font-size:2.6rem;font-weight:800;line-height:1}
  .ghead .biglab{font-size:.72rem;opacity:.85;margin-bottom:5px;line-height:1.3}
  .chiprow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.16);border-radius:20px;padding:5px 11px;font-size:.72rem;font-weight:600;display:flex;align-items:center;gap:5px}
  .chip.up{background:rgba(255,255,255,.22)}
  .ghead-tbl{width:100%;border-collapse:collapse;margin-top:14px}
  .ghead-tbl th{font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;opacity:.8;font-weight:600;padding:0 0 6px;text-align:right}

  .ghead-tbl td.g{font-weight:800;font-size:.95rem}
  .ghead-tbl .ar{font-weight:700;font-size:.76rem;white-space:nowrap}
  .ar.good{color:#4ade80} .ar.bad{color:#f87171} .ar.flat{color:rgba(255,255,255,.6)}

  .bitem.mag{background:#fdf2f8;border:1px solid #fbcfe8;color:#831843}

/* ===== parsing ===== */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else{if(ch==='"')q=true;else if(ch===','){row.push(cur);cur=''}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
      else if(ch!=='\r')cur+=ch;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
const num=s=>parseInt(String(s).replace(/[,$\s]/g,''),10)||0;
function parseMon(s){const m=String(s).trim().match(/^([A-Za-z]{3})-(\d{4})$/);
  if(!m)return null;const mi=MONTHS[m[1].toLowerCase()];if(mi==null)return null;
  return{y:+m[2],m:mi,key:+m[2]*12+mi};}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const title=s=>String(s).toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const initials=s=>String(s).split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
const fmt=n=>n.toLocaleString();
const sign=n=>n>0?'+'+fmt(n):fmt(n);

function buildData(raw){
  const stores=DEALER_STORES[DEALER]||[];
  const set=new Set(stores.map(s=>s.toUpperCase()));
  const recs=[];const monMap={};
  raw.forEach(r=>{
    if(!r||!r[0]||!r[1])return;
    const door=String(r[0]).trim().toUpperCase();
    if(!set.has(door))return;
    const mon=parseMon(r[1]);if(!mon)return;
    const vals=[];let any=false;
    for(let k=0;k<9;k++){const v=num(r[2+k]);vals.push(v);if(v)any=true;}
    if(!any)return;
    recs.push({door:String(r[0]).trim(),mon,vals});
    monMap[mon.key]=mon;
  });
  const months=Object.values(monMap).sort((a,b)=>a.key-b.key);
  return {recs,months,stores};
}
/* convert a freshly fetched Goals CSV into the same [door,monStr,v0..v8] record shape */
function csvToRecords(rows){
  const out=[];
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||!r[0]||!r[1])continue;
    if(!/^[A-Za-z]{3}-\d{4}$/.test(String(r[1]).trim()))continue;
    out.push([r[0],r[1],num(r[3]),num(r[4]),num(r[5]),num(r[6]),num(r[7]),num(r[8]),num(r[9]),num(r[10]),num(r[11])]);
  }
  return out;
}
function totalsByMonth(recs,months){
  const idx={};const out=months.map((mn,i)=>{idx[mn.key]=i;return new Array(9).fill(0)});
  recs.forEach(r=>{const i=idx[r.mon.key];r.vals.forEach((v,k)=>out[i][k]+=v)});
  return out; // out[monthIdx][metricIdx]
}
function storeSeries(recs,months,door){
  const idx={};months.forEach((mn,i)=>idx[mn.key]=i);
  const out=months.map(()=>new Array(9).fill(null));
  recs.filter(r=>r.door===door).forEach(r=>{out[idx[r.mon.key]]=r.vals.slice()});
  return out;
}

/* ===== mini chart ===== */
function miniSpark(series,months,color){
  const vals=series.map(v=>v==null?0:v);
  if(vals.length<2)return '';
  const W=240,H=50,L=8,R=8,T=7,B=15,pw=W-L-R,ph=H-T-B;
  const mx=Math.max(...vals),mn=Math.min(...vals,0),span=Math.max(mx-mn,1);
  const X=i=>L+pw*i/(vals.length-1),Y=v=>T+ph*(1-(v-mn)/span);
  const pts=vals.map((v,i)=>X(i)+','+Y(v)).join(' ');
  const last=vals[vals.length-1],first=vals.find(v=>v>0)||vals[0];
  const col=color||(last<=first?'#16a34a':'#dc2626'); // lower target = good = green
  let lbl='';
  if(months)months.forEach((mn,i)=>{const isL=i===months.length-1;
    lbl+=`<text x="${X(i)}" y="${H-3}" text-anchor="middle" font-size="8.5" fill="${isL?'#16203a':'#94a3b8'}" font-weight="${isL?'700':'400'}">${MSHORT[mn.m]}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
    <polyline fill="none" stroke="${col}" stroke-width="2" points="${pts}"/>
    <circle cx="${X(vals.length-1)}" cy="${Y(last)}" r="2.8" fill="${col}"/>${lbl}</svg>`;
}
function trendChart(months,series,h=150){
  const W=480,H=h,L=30,R=14,T=16,B=24,pw=W-L-R,ph=H-T-B;
  const mx=Math.max(...series,1),yMax=mx*1.12;
  const X=i=>L+pw*(series.length<=1?0.5:i/(series.length-1)),Y=v=>T+ph*(1-v/yMax);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${h}px" xmlns="http://www.w3.org/2000/svg">`;
  // gridlines
  for(let g=0;g<=2;g++){const v=yMax*g/2;const y=Y(v);
    s+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#eef1f6" stroke-width="1"/>
        <text x="${L-5}" y="${y+3}" text-anchor="end" font-size="9" fill="#94a3b8">${Math.round(v)}</text>`;}
  const pts=series.map((v,i)=>[X(i),Y(v),v,i]);
  const down=series[series.length-1]<=series[0];
  const col=down?'#16a34a':'#dc2626'; // downward target trend = good = green
  // area
  s+=`<polyline fill="none" stroke="${col}" stroke-width="2.6" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
  pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${col}"><title>${MSHORT[months[p[3]].m]}: ${p[2]}</title></circle>
    <text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${col}">${p[2]}</text>
    <text x="${p[0]}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="#64748b">${MSHORT[months[p[3]].m]}</text>`});
  return s+'</svg>';
}

/* ===== delta helpers ===== */
function deltaHTML(cur,prev){
  if(prev==null)return '<span class="flat">— new</span>';
  const d=cur-prev;const pct=prev!==0?Math.round(d/prev*100):(cur>0?100:0);
  if(d>0)return `<span class="bad">▲ +${fmt(d)} (${pct>0?'+':''}${pct}%)</span>`;  // higher target = red
  if(d<0)return `<span class="good">▼ ${fmt(d)} (${pct}%)</span>`;                  // lower target = green
  return '<span class="flat">— 0%</span>';
}
function chipHTML(cur,prev){
  if(prev==null||prev===cur)return `<span class="chip">vs last month: no change</span>`;
  const d=cur-prev,pct=prev!==0?Math.round(d/prev*100):100;
  const cls=d<0?'good':'bad';
  const arrow=d>0?'▲':'▼';
  return `<span class="chip ${cls}">${arrow} ${sign(d)} (${pct>0?'+':''}${pct}%) vs ${MSHORT[(prevMonth&&prevMonth.m)]}</span>`;
}

      </div>
      ${miniSpark(ss.map(v=>v?v[0]:0),months)}
      <table class="mtbl"><thead><tr><th>Metric</th><th>${MSHORT[hMon.m]} goal</th><th>vs ${prevMonth?MSHORT[prevMonth.m]:'—'}</th></tr></thead>
      <tbody>${rowsH}</tbody></table>
    </div>`;
  });

  const liveTxt=live?'Live from Google Sheet · Goals tab':'Goals snapshot · embedded in page';
  h+=`<div class="livebar"><span class="pulse"></span><span>${liveTxt} · ${MNAME[hMon.m]} ${hMon.y}</span></div></div>`;
  root.innerHTML=h;
  document.getElementById('foot').innerHTML=`Tomorrow Telecom · Monthly Goals (Google Sheet · Goals tab)<br>${esc(DEALER)} · shared ${MSHORT[postMonthIdx]} 27 for ${MNAME[hMon.m]} ${hMon.y}`;
}
function lastGross(recs,door){
  let best=-1,bk=-1;
  recs.filter(r=>r.door===door).forEach(r=>{if(r.mon.key>bk){bk=r.mon.key;best=r.vals[0]}});
  return best<0?0:best;
}

function load(){
  // 1) render the embedded snapshot instantly — works offline and from a local file://
  try{render(buildData(EMBEDDED),false)}catch(e){}
  // 2) try to refresh from the live sheet — works when hosted on https (e.g. GitHub Pages)
  fetch(GOALS_URL+'&t='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.text():Promise.reject())
    .then(t=>{const recs=csvToRecords(parseCSV(t));if(recs.length)render(buildData(recs),true)})
    .catch(()=>{});
}
load();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
