<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month-To-Date Performance — Live</title>
<style>
  :root{--bg:#f4f6fa;--card:#ffffff;--text:#1c2433;--muted:#64748b;--border:#e2e8f0;--track:#eef1f6;
    --red:#dc2626;--amber:#d97706;--green:#16a34a;--blue:#2563eb;
    --redbg:#fdf0f0;--amberbg:#fdf6ea;--greenbg:#f0f9f2}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px}
  .wrap{max-width:1500px;margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  header h1{font-size:1.7rem;font-weight:700;letter-spacing:.3px}
  header p{color:var(--muted);margin-top:5px;font-size:.9rem}
  .live-line{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:7px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
  .pulse{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .refresh-btn,.view-btn{background:var(--card);border:1px solid var(--border);color:var(--blue);font-size:.78rem;padding:4px 12px;border-radius:16px;cursor:pointer}
  .refresh-btn:hover,.view-btn:hover{border-color:var(--blue)}
  .view-btn.active{background:rgba(37,99,235,.1);border-color:var(--blue);font-weight:600}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%}
  .banner{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:.85rem;text-align:center}
  .filters{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .filter-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .filter-row:last-child{margin-bottom:0}
  .filter-label{font-size:.7rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);min-width:84px}
  .chip{background:var(--bg);border:1px solid var(--border);color:var(--muted);font-size:.78rem;padding:5px 12px;border-radius:18px;cursor:pointer;transition:all .15s}
  .chip:hover{color:var(--text);border-color:var(--blue)}
  .chip.active{background:rgba(37,99,235,.1);border-color:var(--blue);color:var(--blue);font-weight:600}
  .chip.dim{opacity:.4}
  .count-line{font-size:.75rem;color:var(--muted);margin-top:8px}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .sum-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .today-card{border-left:4px solid var(--blue)}
  .sum-label{font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .sum-val{font-size:1.35rem;font-weight:700;margin:2px 0 1px}
  .sum-sub{font-size:.72rem;color:var(--muted);margin-bottom:6px;line-height:1.35}
  .bar{height:7px;background:var(--track);border-radius:6px;overflow:hidden}
  .fill{height:100%;border-radius:6px;transition:width .6s ease}
  /* ===== table view ===== */
  .tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.06);overflow:auto;max-height:calc(100vh - 110px)}
  table.compact{width:100%;border-collapse:collapse;font-size:.8rem;min-width:1100px}
  .compact thead th{position:sticky;top:0;background:var(--card);z-index:2;border-bottom:2px solid var(--border);padding:8px 6px;font-size:.66rem;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap}
  .compact thead th.sortable{cursor:pointer}
  .compact thead th.sortable:hover{color:var(--blue)}
  .compact thead th.sorted{color:var(--blue)}
  .compact tbody td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle;white-space:nowrap}
  .compact tbody tr:hover{background:#f8fafc}
  .compact td.store{text-align:left;font-weight:700;font-size:.82rem}
  .compact td.who{text-align:left;color:var(--muted);font-size:.72rem;line-height:1.3;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .mcell{display:flex;flex-direction:column;align-items:center;line-height:1.25}
  .mcell .top{font-weight:600}
  .mcell .top .of{color:var(--muted);font-weight:400}
  .mcell .bot{font-size:.72rem;font-weight:700}
  td.c-green{background:var(--greenbg)} td.c-amber{background:var(--amberbg)} td.c-red{background:var(--redbg)}
  .tdy{font-weight:700;color:var(--blue)}
  .statdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
  .totrow td{font-weight:700;background:#f1f5fb;border-top:2px solid var(--border);position:sticky;bottom:0}
  /* ===== card view ===== */
  .dist-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;font-size:1.1rem;margin:26px 0 14px;border-bottom:2px solid var(--border);padding-bottom:7px}
  .dist-stat{font-size:.83rem;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .card h2{font-size:1.1rem}
  .badge{font-size:.64rem;font-weight:700;letter-spacing:.8px;padding:4px 10px;border-radius:20px;text-transform:uppercase;flex-shrink:0}
  .badge.critical{background:rgba(220,38,38,.1);color:var(--red);border:1px solid rgba(220,38,38,.35)}
  .badge.high{background:rgba(217,119,6,.1);color:var(--amber);border:1px solid rgba(217,119,6,.35)}
  .badge.on-pace{background:rgba(22,163,74,.1);color:var(--green);border:1px solid rgba(22,163,74,.35)}
  .focus-line{color:var(--muted);font-size:.8rem;margin-bottom:12px}
  .mtable{width:100%;border-collapse:collapse;font-size:.82rem}
  .mtable th{font-size:.62rem;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 6px 6px;font-weight:600}
  .mtable th:first-child{text-align:left;padding-left:0}
  .mtable td{padding:4px 6px;text-align:right;vertical-align:middle}
  .mname{text-align:left!important;padding-left:0!important;font-weight:600}
  .mtoday{color:var(--blue);font-weight:600;width:42px}
  .mnum{white-space:nowrap;font-weight:600}
  .of{color:var(--muted);font-weight:400}
  .mvar{font-weight:700;width:46px}
  .mrem{color:var(--muted);width:44px}
  .mbar{width:23%}
  .mpct{font-weight:700;width:50px}
  .statgrid{margin-top:10px;border-top:1px solid var(--border);padding-top:9px;display:flex;flex-direction:column;gap:4px}
  .statrow{display:flex;gap:8px;align-items:baseline;font-size:.78rem}
  .statrow span{color:var(--muted);min-width:124px}
  .statrow em{color:var(--muted);font-style:normal;font-size:.73rem}
  footer{text-align:center;color:var(--muted);font-size:.76rem;margin-top:28px}
  #loading{text-align:center;color:var(--muted);padding:60px 0;font-size:.95rem}
  /* ===== trend view ===== */
  .trend-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .trend-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .trend-note{font-size:.75rem;color:var(--muted)}
  .chart-holder{position:relative;height:420px}
  .trend-stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--border);padding-top:10px;font-size:.8rem;color:var(--muted)}
  .trend-stats strong{color:var(--text)}
  @media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 Month-To-Date Performance</h1>
    <p id="metaLine">Loading…</p>
    <div class="live-line">
      <span class="pulse"></span>
      <span id="updatedLine">Connecting to Google Sheet…</span>
      <button class="refresh-btn" onclick="loadData(true)">↻ Refresh now</button>
      <button class="view-btn" id="btnTable" onclick="setView('table')">☰ Table</button>
      <button class="view-btn" id="btnCards" onclick="setView('cards')">▦ Cards</button>
      <button class="view-btn" id="btnTrend" onclick="setView('trend')">📈 Trend</button>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>On pace (≥100%)</span>
      <span><span class="dot" style="background:var(--amber)"></span>Needs push (70–99%)</span>
      <span><span class="dot" style="background:var(--red)"></span>Critical (&lt;70%)</span>
      <span>Δ = MTD performance vs. MTD goal · To Go = remaining to full-month goal · click a metric header to sort</span>
    </div>
  </header>

  <div class="banner" id="errBanner"></div>

  <div class="filters" id="filters" style="display:none">
    <div class="filter-row"><span class="filter-label">Market</span><span id="marketChips"></span></div>
    <div class="filter-row"><span class="filter-label">Sub-Dealer</span><span id="dealerChips"></span></div>
    <div class="count-line" id="countLine"></div>
  </div>

  <div class="summary" id="summary"></div>
  <div id="content"></div>
  <div id="loading">Loading live data from Google Sheet…</div>
  <footer id="foot"></footer>
</div>
<script>
const SHEET_ID='1ztd-eO1eXg4sO6zwoLNPC8T833ffXWvu2PrZsU5kSzM', GID='593325688';
const URLS=[
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`,
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`
];
const DAILY_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('Daily Perf Data')}`;
const REFRESH_MS=10*60*1000;
const NAMES=['New All','New Voice','HINT','BTS','MAGENTA'];
const DEALER_OVERRIDES={'MATLOCK':'Sid','I-20':'Sid'};
const MKT_ABBR={'Express North Dallas':'N Dallas','Express South Dallas':'S Dallas','Express Fort Worth/West Texas':'FW / W TX'};
let model=null,daily=null,chart=null;
const state={market:localStorage.getItem('f_market')||'__all__',dealer:localStorage.getItem('f_dealer')||'__all__'};
let view=localStorage.getItem('view')||'table';
let sortIdx=parseInt(localStorage.getItem('sortIdx')||'0',10);
let trendIdx=parseInt(localStorage.getItem('trendIdx')||'0',10);

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}
      else cur+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===','){row.push(cur);cur=''}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
      else if(ch!=='\r')cur+=ch;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
const num=s=>parseInt(String(s).replace(/[,$\s]/g,''),10)||0;

function buildModel(rows){
  const asOf=(rows[0]&&rows[0][19])||'';
  const meta={asOf,reportDate:rows[1][0],eom:rows[1][1],daysLeft:rows[1][2],
    paceFrac:(parseFloat(String(rows[1][3]).replace('%',''))||40)/100};
  const stores=[];
  for(let i=3;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r[0]||!r[3])break;
    const goal=r.slice(6,11).map(num),mtd=r.slice(11,16).map(num),today=r.slice(16,21).map(num);
    const vari=r.slice(26,31).map(num),rem=r.slice(36,41).map(num);
    const pace=goal.map((g,j)=>{const t=Math.round(g*meta.paceFrac);return t>0?mtd[j]/t*100:0});
    const km=String(r[4]).match(/\(S\)\s*(.+)$/);
    stores.push({market:r[0].trim(),rdm:r[1].trim(),dealer:DEALER_OVERRIDES[r[3].trim()]||r[2].trim(),
      store:r[3].trim(),idKey:km?km[1].trim():r[3].trim(),goal,mtd,today,vari,rem,pace,
      qpayT:r[41],convT:r[42],qpayM:r[43],convM:r[44],featT:r[45],featM:r[46],topFeat:(r[51]||'').trim()});
  }
  return {meta,stores};
}
const colorFor=p=>p>=100?'var(--green)':p>=70?'var(--amber)':'var(--red)';
const cellCls=p=>p>=100?'c-green':p>=70?'c-amber':'c-red';
const badgeFor=p=>p>=100?['on-pace','On Pace']:p>=70?['high','Needs Push']:['critical','Critical'];
const sign=n=>n>0?'+'+n:''+n;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const title=s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());

function setView(v){view=v;localStorage.setItem('view',v);render()}
function chipHTML(filter,vals){
  let h=`<button class="chip" data-filter="${filter}" data-val="__all__">All</button>`;
  vals.forEach(v=>h+=`<button class="chip" data-filter="${filter}" data-val="${esc(v)}">${esc(v)}</button>`);
  return h;
}
function matches(s){return (state.market==='__all__'||s.market===state.market)&&(state.dealer==='__all__'||s.dealer===state.dealer)}

function tableHTML(vis,pf){
  const sorted=vis.slice().sort((a,b)=>a.pace[sortIdx]-b.pace[sortIdx]);
  let mheads='';
  NAMES.forEach((n,i)=>{mheads+=`<th class="sortable ${i===sortIdx?'sorted':''}" onclick="setSort(${i})">${n} ${i===sortIdx?'▲':''}</th>`});
  let rows='';
  sorted.forEach(s=>{
    let mcells='';
    NAMES.forEach((n,i)=>{
      const p=s.pace[i],v=s.vari[i];
      mcells+=`<td class="${cellCls(p)}"><div class="mcell">
        <span class="top">${s.mtd[i]}<span class="of">/${s.goal[i]}</span>${s.today[i]?` <span class="tdy">${sign(s.today[i])}</span>`:''}</span>
        <span class="bot" style="color:${colorFor(p)}">${p.toFixed(0)}% · ${sign(v)}</span></div></td>`;
    });
    rows+=`<tr>
      <td class="store"><span class="statdot" style="background:${colorFor(s.pace[0])}"></span>${esc(title(s.store))}</td>
      <td class="who">${esc(s.dealer)}<br>${esc(MKT_ABBR[s.market]||s.market)} · ${esc(s.rdm)}</td>
      ${mcells}
      <td>${esc(s.convM)}<br><span style="color:var(--muted);font-size:.7rem">${esc(s.qpayM)} QPAY</span></td>
      <td>${esc(s.featM)}</td>
    </tr>`;
  });
  // totals row
  let tcells='';
  NAMES.forEach((n,i)=>{
    let m=0,g=0,t=0;vis.forEach(s=>{m+=s.mtd[i];g+=s.goal[i];t+=s.today[i]});
    const p=g?m/(g*pf)*100:0;
    tcells+=`<td class="${cellCls(p)}"><div class="mcell"><span class="top">${m.toLocaleString()}<span class="of">/${g.toLocaleString()}</span>${t?` <span class="tdy">${sign(t)}</span>`:''}</span><span class="bot" style="color:${colorFor(p)}">${p.toFixed(0)}%</span></div></td>`;
  });
  return `<div class="tbl-wrap"><table class="compact">
    <thead><tr><th style="text-align:left">Store</th><th style="text-align:left">Sub-Dealer / Mkt / RDM</th>${mheads}<th>Conv MTD</th><th>Feat $/Box</th></tr></thead>
    <tbody>${rows}<tr class="totrow"><td class="store">TOTAL</td><td class="who">${vis.length} stores</td>${tcells}<td></td><td></td></tr></tbody>
  </table></div>`;
}
function setSort(i){sortIdx=i;localStorage.setItem('sortIdx',i);render()}
function setTrendIdx(i){trendIdx=i;localStorage.setItem('trendIdx',i);render()}

// Daily Perf Data: col0 date, col1 SAP, col2 store id, col5 New All, col6 New Voice, col26 BTS, col29 HINT
const DAILY_COL={0:5,1:6,2:29,3:26}; // metric index -> daily column (MAGENTA n/a)
function buildDaily(rows){
  const recs=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r[0])continue;            // separator rows
    if(!r[1]&&!r[2])continue;         // totals rows
    const km=String(r[2]).match(/\(S\)\s*(.+)$/);
    recs.push({date:r[0].trim(),key:km?km[1].trim():null,
      vals:{0:num(r[5]),1:num(r[6]),2:num(r[29]),3:num(r[26])}});
  }
  return recs;
}
function parseMDY(s){const p=s.split('/');return new Date(+p[2],+p[0]-1,+p[1])}
function fmtMD(d){return (d.getMonth()+1)+'/'+d.getDate()}

function trendHTML(){
  let chips='';
  NAMES.forEach((n,i)=>{
    const dis=DAILY_COL[i]===undefined;
    chips+=`<button class="chip ${i===trendIdx?'active':''} ${dis?'dim':''}" ${dis?'disabled title="Not in Daily Perf Data tab"':''} onclick="setTrendIdx(${i})">${n}</button>`;
  });
  return `<div class="trend-box">
    <div class="trend-head"><span>${chips}</span><span class="trend-note" id="trendNote"></span></div>
    <div class="chart-holder" id="chartHolder"></div>
    <div class="trend-stats" id="trendStats"></div>
  </div>`;
}

function drawTrend(vis,pf){
  if(DAILY_COL[trendIdx]===undefined)trendIdx=0;
  const m=trendIdx;
  const meta=model.meta;
  const start=parseMDY(meta.reportDate);start.setDate(1);
  const eom=parseMDY(meta.eom);
  const nDays=eom.getDate();
  const labels=[];for(let d=1;d<=nDays;d++)labels.push(fmtMD(new Date(start.getFullYear(),start.getMonth(),d)));
  const goalTotal=vis.reduce((t,s)=>t+s.goal[m],0);
  const mtd=vis.reduce((t,s)=>t+s.mtd[m],0);
  const goalLine=labels.map((_,i)=>+(goalTotal*(i+1)/nDays).toFixed(1));
  // filter daily records
  const noFilter=state.market==='__all__'&&state.dealer==='__all__';
  const keys=new Set(vis.map(s=>s.idKey));
  const dayMap={};
  (daily||[]).forEach(r=>{
    const inSet=r.key?keys.has(r.key):noFilter;
    if(!inSet)return;
    dayMap[r.date]=(dayMap[r.date]||0)+r.vals[m];
  });
  const dates=Object.keys(dayMap).sort((a,b)=>parseMDY(a)-parseMDY(b));
  const dailyData=labels.map(()=>null);
  dates.forEach(dt=>{const i=parseMDY(dt).getDate()-1;if(i>=0&&i<nDays)dailyData[i]=dayMap[dt]});
  // cumulative actual: anchor so the last daily date equals current MTD
  const cum=labels.map(()=>null);
  if(dates.length){
    const winSum=dates.reduce((t,d)=>t+dayMap[d],0);
    let run=mtd-winSum;
    const firstIdx=parseMDY(dates[0]).getDate()-1;
    if(firstIdx-1>=0)cum[firstIdx-1]=run;
    dates.forEach(dt=>{const i=parseMDY(dt).getDate()-1;run+=dayMap[dt];if(i>=0&&i<nDays)cum[i]=run});
  }
  const todayIdx=parseMDY(meta.reportDate).getDate()-1;
  const paceTarget=goalLine[todayIdx];
  // ===== self-contained SVG chart =====
  const W=1000,H=420,L=64,R=56,T=18,B=46;
  const pw=W-L-R,ph=H-T-B;
  const yMax=Math.max(goalTotal,...cum.filter(v=>v!=null),1)*1.06;
  const dMax=Math.max(...dailyData.filter(v=>v!=null),1)*1.6;
  const X=i=>L+pw*(i+.5)/nDays;
  const Y=v=>T+ph*(1-v/yMax);
  const Y2=v=>T+ph*(1-v/dMax);
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,system-ui,sans-serif">`;
  // gridlines + y labels
  for(let g=0;g<=4;g++){
    const v=yMax*g/4,y=Y(v);
    svg+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#eef1f6" stroke-width="1"/>`;
    svg+=`<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#64748b">${Math.round(v).toLocaleString()}</text>`;
  }
  // x labels (every 2 days)
  labels.forEach((lb,i)=>{
    if(i%2===0)svg+=`<text x="${X(i)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="#64748b">${lb}</text>`;
  });
  // daily bars (right axis)
  const bw=Math.max(4,pw/nDays*.55);
  dailyData.forEach((v,i)=>{
    if(v==null)return;
    const y=Y2(v);
    svg+=`<rect x="${X(i)-bw/2}" y="${y}" width="${bw}" height="${T+ph-y}" fill="rgba(22,163,74,.45)" rx="2"><title>${labels[i]}: +${v} daily</title></rect>`;
    svg+=`<text x="${X(i)}" y="${y-4}" text-anchor="middle" font-size="10" fill="#16a34a">+${v}</text>`;
  });
  // goal pace dashed line
  svg+=`<polyline fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" points="${labels.map((_,i)=>X(i)+','+Y(goalLine[i])).join(' ')}"/>`;
  // today marker
  svg+=`<line x1="${X(todayIdx)}" y1="${T}" x2="${X(todayIdx)}" y2="${T+ph}" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/>`;
  svg+=`<text x="${X(todayIdx)}" y="${T-4}" text-anchor="middle" font-size="10" fill="#d97706">today</text>`;
  // actual cumulative line + area
  const pts=[];cum.forEach((v,i)=>{if(v!=null)pts.push([X(i),Y(v),v,labels[i]])});
  if(pts.length){
    svg+=`<polygon fill="rgba(37,99,235,.07)" points="${pts.map(p=>p[0]+','+p[1]).join(' ')} ${pts[pts.length-1][0]},${T+ph} ${pts[0][0]},${T+ph}"/>`;
    svg+=`<polyline fill="none" stroke="#2563eb" stroke-width="3" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
    pts.forEach(p=>{svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2563eb"><title>${p[3]}: ${p[2].toLocaleString()} cumulative</title></circle>`});
    const lp=pts[pts.length-1];
    svg+=`<text x="${lp[0]+8}" y="${lp[1]-6}" font-size="12" font-weight="700" fill="#2563eb">${lp[2].toLocaleString()}</text>`;
  }
  // goal end label
  svg+=`<text x="${W-R+6}" y="${Y(goalTotal)+4}" font-size="11" fill="#64748b">goal ${goalTotal.toLocaleString()}</text>`;
  // legend
  svg+=`<g font-size="11" fill="#64748b">
    <line x1="${L}" y1="${H-10}" x2="${L+24}" y2="${H-10}" stroke="#2563eb" stroke-width="3"/><text x="${L+30}" y="${H-6}">Actual (cumulative)</text>
    <line x1="${L+180}" y1="${H-10}" x2="${L+204}" y2="${H-10}" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/><text x="${L+210}" y="${H-6}">Goal pace</text>
    <rect x="${L+300}" y="${H-17}" width="12" height="10" fill="rgba(22,163,74,.45)"/><text x="${L+318}" y="${H-6}">Daily adds (right scale)</text>
  </g>`;
  svg+='</svg>';
  document.getElementById('chartHolder').innerHTML=svg;
  const gap=mtd-paceTarget;
  document.getElementById('trendNote').textContent=`Daily history available from ${dates[0]||'n/a'} (sheet keeps recent days; the line extends automatically as days accumulate)`;
  document.getElementById('trendStats').innerHTML=
    `<span>MTD: <strong>${mtd.toLocaleString()}</strong></span>
     <span>Pace target today: <strong>${Math.round(paceTarget).toLocaleString()}</strong></span>
     <span>Gap vs pace: <strong style="color:${gap>=0?'var(--green)':'var(--red)'}">${gap>=0?'+':''}${Math.round(gap).toLocaleString()}</strong></span>
     <span>Month goal: <strong>${goalTotal.toLocaleString()}</strong></span>
     <span>To go: <strong>${(goalTotal-mtd).toLocaleString()}</strong> in ${meta.daysLeft} days (${Math.ceil((goalTotal-mtd)/Math.max(+meta.daysLeft,1)).toLocaleString()}/day)</span>`;
}

function cardHTML(s){
  const [cls,lbl]=badgeFor(s.pace[0]);
  let rows='';
  NAMES.forEach((n,i)=>{
    const p=s.pace[i],col=colorFor(p),v=s.vari[i];
    rows+=`<tr><td class="mname">${n}</td>
      <td class="mtoday">${s.today[i]?sign(s.today[i]):'—'}</td>
      <td class="mnum">${s.mtd[i]}<span class="of">/${s.goal[i]}</span></td>
      <td class="mvar" style="color:${v>=0?'var(--green)':'var(--red)'}">${sign(v)}</td>
      <td class="mrem">${s.rem[i]}</td>
      <td class="mbar"><div class="bar"><div class="fill" style="background:${col};width:${Math.min(p,100).toFixed(1)}%"></div></div></td>
      <td class="mpct" style="color:${col}">${p.toFixed(0)}%</td></tr>`;
  });
  let feat=`${s.featM}/box MTD`;
  if(s.featT&&!/^\$\s*0(\.00)?\s*$|^\$\s*-/.test(s.featT.trim()))feat+=` · ${s.featT} today`;
  return `<div class="card">
    <div class="card-head"><h2>📍 ${esc(title(s.store))}</h2><span class="badge ${cls}">${lbl}</span></div>
    <p class="focus-line">RDM: <strong>${esc(s.rdm)}</strong> · Sub-Dealer: <strong>${esc(s.dealer)}</strong></p>
    <table class="mtable"><thead><tr><th></th><th>Today</th><th>MTD/Goal</th><th>Δ Pace</th><th>To Go</th><th></th><th>On-Tgt</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="statgrid">
      <div class="statrow"><span>Conversion MTD</span><strong>${esc(s.convM)}</strong><em>${esc(s.qpayM)} QPAY</em></div>
      <div class="statrow"><span>Conversion Today</span><strong>${esc(s.convT)}</strong><em>${esc(s.qpayT)} QPAY</em></div>
      <div class="statrow"><span>Feature Revenue</span><strong>${esc(feat)}</strong></div>
      ${s.topFeat?`<div class="statrow"><span>Top Feature</span><strong>${esc(s.topFeat)}</strong></div>`:''}
    </div></div>`;
}
function cardsHTML(vis,pf){
  const byDist={};
  vis.forEach(s=>{(byDist[s.market]=byDist[s.market]||[]).push(s)});
  const order=Object.keys(byDist).sort((a,b)=>{
    const avg=d=>byDist[d].reduce((t,s)=>t+s.pace[0],0)/byDist[d].length;
    return avg(a)-avg(b);
  });
  let h='';
  order.forEach(d=>{
    const ds=byDist[d].slice().sort((a,b)=>a.pace[0]-b.pace[0]);
    let m=0,g=0;ds.forEach(s=>{m+=s.mtd[0];g+=s.goal[0]});
    const p=m/(g*pf)*100;
    h+=`<div class="district"><h2 class="dist-head"><span>${esc(d)}</span><span class="dist-stat" style="color:${colorFor(p)}">${p.toFixed(0)}% on-target · ${m}/${g} New All</span></h2><div class="grid">${ds.map(cardHTML).join('')}</div></div>`;
  });
  return h;
}

function render(){
  if(!model)return;
  const {meta,stores}=model,pf=meta.paceFrac;
  document.getElementById('metaLine').innerHTML=
    `Movement today as of <strong>${esc(meta.asOf||meta.reportDate)}</strong> · ${(pf*100).toFixed(0)}% through month (${esc(meta.daysLeft)} days remaining) · On-target % = performance vs. MTD pace goal`;
  document.getElementById('btnTable').classList.toggle('active',view==='table');
  document.getElementById('btnCards').classList.toggle('active',view==='cards');
  document.getElementById('btnTrend').classList.toggle('active',view==='trend');
  const markets=[...new Set(stores.map(s=>s.market))].sort();
  const dealers=[...new Set(stores.map(s=>s.dealer))].sort();
  if(state.market!=='__all__'&&!markets.includes(state.market))state.market='__all__';
  if(state.dealer!=='__all__'&&!dealers.includes(state.dealer))state.dealer='__all__';
  document.getElementById('marketChips').innerHTML=chipHTML('market',markets);
  document.getElementById('dealerChips').innerHTML=chipHTML('dealer',dealers);
  document.querySelectorAll('.chip').forEach(ch=>{
    ch.classList.toggle('active',state[ch.dataset.filter]===ch.dataset.val);
    ch.addEventListener('click',()=>{
      state[ch.dataset.filter]=ch.dataset.val;
      if(!stores.some(matches))state[ch.dataset.filter==='market'?'dealer':'market']='__all__';
      localStorage.setItem('f_market',state.market);localStorage.setItem('f_dealer',state.dealer);
      render();
    });
    if(ch.dataset.val!=='__all__'){
      const other=ch.dataset.filter==='market'?'dealer':'market';
      const any=stores.some(s=>(ch.dataset.filter==='market'?s.market:s.dealer)===ch.dataset.val&&(state[other]==='__all__'||(other==='market'?s.market:s.dealer)===state[other]));
      ch.classList.toggle('dim',!any);
    }
  });
  document.getElementById('filters').style.display='';
  const vis=stores.filter(matches);
  // summary
  const tdy=[0,0,0,0,0];let sumHTML='';
  for(let i=0;i<5;i++){
    let m=0,g=0;vis.forEach(s=>{m+=s.mtd[i];g+=s.goal[i];tdy[i]+=s.today[i]});
    const p=g?m/(g*pf)*100:0,col=colorFor(p);
    sumHTML+=`<div class="sum-card"><div class="sum-label">${NAMES[i]}</div><div class="sum-val" style="color:${col}">${p.toFixed(0)}%</div><div class="sum-sub">${m.toLocaleString()} / ${g.toLocaleString()} goal</div><div class="bar"><div class="fill" style="background:${col};width:${Math.min(p,100)}%"></div></div></div>`;
  }
  const tot=tdy.reduce((a,b)=>a+b,0);
  document.getElementById('summary').innerHTML=
    `<div class="sum-card today-card"><div class="sum-label">Movement Today</div><div class="sum-val">+${tot}</div><div class="sum-sub">${tdy.map((v,i)=>NAMES[i]+' +'+v).join(' · ')}</div></div>`+sumHTML;
  document.getElementById('content').innerHTML=view==='table'?tableHTML(vis,pf):view==='cards'?cardsHTML(vis,pf):trendHTML();
  if(view==='trend')drawTrend(vis,pf);
  document.getElementById('countLine').textContent=`Showing ${vis.length} of ${stores.length} stores`;
  document.getElementById('loading').style.display='none';
  document.getElementById('foot').textContent=`Source: Month-To-Date Perf (Google Sheet) · Sorted worst-first · Auto-refreshes every 10 minutes`;
}

async function loadData(manual){
  const u=document.getElementById('updatedLine');
  if(manual)u.textContent='Refreshing…';
  let text=null;
  for(const url of URLS){
    try{const r=await fetch(url+'&t='+Date.now(),{cache:'no-store'});if(r.ok){text=await r.text();break}}catch(e){}
  }
  try{
    const rd=await fetch(DAILY_URL+'&t='+Date.now(),{cache:'no-store'});
    if(rd.ok)daily=buildDaily(parseCSV(await rd.text()));
  }catch(e){daily=daily||[]}
  const banner=document.getElementById('errBanner');
  if(!text){
    banner.style.display='block';
    banner.textContent='Could not reach the Google Sheet. Check your connection — will retry automatically.';
    u.textContent='Last attempt failed · '+new Date().toLocaleTimeString();
    return;
  }
  try{
    const m=buildModel(parseCSV(text));
    if(!m.stores.length)throw new Error('no rows');
    model=m;banner.style.display='none';
    render();
    u.textContent='Live · Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' · Sheet timestamp: '+(m.meta.asOf||'n/a');
  }catch(e){
    banner.style.display='block';
    banner.textContent='Sheet layout changed — could not parse data. Showing last good data if available.';
  }
}
loadData();
setInterval(loadData,REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadData()});
</script>
