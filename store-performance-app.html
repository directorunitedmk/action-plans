<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomorrow Telecom · Store Performance</title>
<style>
  :root{--bg:#f1f4f9;--card:#ffffff;--text:#16203a;--muted:#64748b;--border:#e2e8f0;--track:#eef1f6;
    --red:#dc2626;--amber:#d97706;--green:#16a34a;--blue:#2563eb;--magenta:#e20074;
    --grad:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#e20074 130%)}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
  .phone{width:100%;max-width:520px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  .appbar{background:var(--grad);color:#fff;padding:16px 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(16,24,40,.18)}
  .appbar .back,.appbar .home{background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer;flex-shrink:0}
  .appbar .titles{flex:1;min-width:0}
  .appbar h1{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar .sub{font-size:.72rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .screen{flex:1;padding:18px 16px 30px;animation:slidein .22s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  .livebar{display:flex;align-items:center;gap:7px;justify-content:center;font-size:.72rem;color:var(--muted);padding:8px 0 0}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .hero{text-align:center;padding:40px 10px 26px}
  .hero .logo{font-size:3rem}
  .hero h2{font-size:1.5rem;margin-top:10px}
  .hero p{color:var(--muted);font-size:.9rem;margin-top:6px}
  .role-btn{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px 18px;margin-top:14px;cursor:pointer;text-align:left;box-shadow:0 1px 4px rgba(16,24,40,.07);transition:transform .12s}
  .role-btn:active{transform:scale(.98)}
  .role-btn .ic{font-size:1.9rem;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .role-btn .ic.emp{background:rgba(37,99,235,.12)}
  .role-btn .ic.mgr{background:rgba(226,0,116,.1)}
  .role-btn h3{font-size:1.05rem}
  .role-btn p{font-size:.78rem;color:var(--muted);margin-top:2px}
  .role-btn .chev{margin-left:auto;color:var(--muted)}
  .list-title{font-size:.78rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 2px 10px}
  .item{display:flex;align-items:center;gap:13px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:14px 15px;margin-bottom:10px;cursor:pointer;text-align:left;box-shadow:0 1px 3px rgba(16,24,40,.06);transition:transform .12s}
  .item:active{transform:scale(.985)}
  .item .av{width:42px;height:42px;border-radius:12px;background:rgba(37,99,235,.1);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;flex-shrink:0}
  .item .av.all{background:rgba(226,0,116,.1);color:var(--magenta)}
  .item .info{flex:1;min-width:0}
  .item h3{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item p{font-size:.72rem;color:var(--muted);margin-top:1px}
  .item .right{text-align:right;flex-shrink:0}
  .item .pct{font-weight:700;font-size:.95rem}
  .item .rsub{font-size:.7rem;color:var(--muted)}
  /* brief / attack board */
  .brief{margin-bottom:14px}
  .bitem{display:flex;gap:11px;align-items:flex-start;border-radius:14px;padding:12px 30px 12px 14px;margin-bottom:8px;font-size:.84rem;line-height:1.45;box-shadow:0 1px 3px rgba(16,24,40,.06);animation:slidein .25s ease;position:relative;touch-action:pan-y;transition:transform .22s ease,opacity .22s ease}
  .bitem.gone{transform:translateX(110%);opacity:0}
  .bx{position:absolute;top:5px;right:5px;border:none;background:transparent;color:inherit;opacity:.4;font-size:.95rem;cursor:pointer;padding:5px 7px;line-height:1}
  .bx:hover{opacity:.9}
  .bitem .bic{font-size:1.05rem;flex-shrink:0;margin-top:1px}
  .bitem b{font-weight:700}
  .bitem.crit{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d}
  .bitem.warn{background:#fffbeb;border:1px solid #fde68a;color:#78350f}
  .bitem.win{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
  .bitem.party{background:linear-gradient(135deg,#f0fdf4,#ecfeff);border:2px solid #34d399;color:#065f46;font-weight:600}
  .brief-head{display:flex;align-items:center;gap:8px;font-size:.74rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:2px 2px 8px}
  .brief-head .clock{color:var(--blue);font-weight:700}
  .sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
  .sum{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:10px 11px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .sum .lab{font-size:.62rem;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
  .sum .val{font-size:1.15rem;font-weight:700;margin:2px 0 1px}
  .sum .sub{font-size:.66rem;color:var(--muted)}
  .det-head{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .det-head .row1{display:flex;justify-content:space-between;align-items:center}
  .det-head h2{font-size:1.2rem}
  .badge{font-size:.62rem;font-weight:700;letter-spacing:.7px;padding:4px 10px;border-radius:20px;text-transform:uppercase;flex-shrink:0}
  .badge.critical{background:rgba(220,38,38,.1);color:var(--red)}
  .badge.high{background:rgba(217,119,6,.1);color:var(--amber)}
  .badge.on-pace{background:rgba(22,163,74,.1);color:var(--green)}
  .badge.q{background:rgba(37,99,235,.1);color:var(--blue)}
  .badge.qbad{background:rgba(220,38,38,.1);color:var(--red)}
  .badge.qtop{background:rgba(22,163,74,.1);color:var(--green)}
  .det-head .who{font-size:.76rem;color:var(--muted);margin-top:4px}
  .bigpct{display:flex;align-items:baseline;gap:8px;margin-top:12px}
  .bigpct .n{font-size:2.2rem;font-weight:800;line-height:1}
  .bigpct .d{font-size:.78rem;color:var(--muted)}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px 16px;margin-bottom:13px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .panel h3{font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
  .met{margin-bottom:13px}
  .met:last-child{margin-bottom:0}
  .met .top{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:5px}
  .met .nm{font-weight:600}
  .met .nums{color:var(--muted)}
  .met .nums b{color:var(--text)}
  .met .pc{font-weight:700;margin-left:8px}
  .bar{height:8px;background:var(--track);border-radius:6px;overflow:hidden}
  .fill{height:100%;border-radius:6px;transition:width .7s ease}
  .met .foot{display:flex;gap:14px;font-size:.7rem;color:var(--muted);margin-top:4px}
  .statline{display:flex;justify-content:space-between;font-size:.82rem;padding:7px 0;border-bottom:1px solid var(--track);gap:10px}
  .statline:last-child{border-bottom:none}
  .statline span{color:var(--muted)}
  .statline b{font-weight:700;text-align:right}
  /* ELB */
  .elb-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .elb-rank{font-size:1.9rem;font-weight:800;line-height:1}
  .elb-meta{font-size:.74rem;color:var(--muted);line-height:1.5}
  .chg{font-weight:700;font-size:.8rem}
  .chg.up{color:var(--green)} .chg.dn{color:var(--red)} .chg.flat{color:var(--muted)}
  .cat{display:flex;align-items:center;gap:8px;font-size:.8rem;padding:6px 0;border-bottom:1px solid var(--track)}
  .cat:last-child{border-bottom:none}
  .cat .cn{flex:1;min-width:0}
  .cat .w{font-size:.64rem;background:var(--track);color:var(--muted);border-radius:10px;padding:2px 7px;flex-shrink:0}
  .cat .cr{color:var(--muted);font-size:.7rem;width:54px;text-align:right;flex-shrink:0}
  .cat .cs{font-weight:700;width:58px;text-align:right;flex-shrink:0}
  .lb-row{display:flex;align-items:center;gap:10px;font-size:.82rem;padding:7px 0;border-bottom:1px solid var(--track)}
  .lb-row:last-child{border-bottom:none}
  .lb-row .nm{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-row .rk{font-weight:700;width:58px;text-align:right}
  .lb-row .ch{width:64px;text-align:right}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:12px;font-size:.82rem;text-align:center;margin-bottom:12px}
  #loading{text-align:center;color:var(--muted);padding:80px 20px;font-size:.95rem}
  footer{text-align:center;font-size:.68rem;color:var(--muted);padding:0 0 22px}
  /* confetti */
  .cf{position:fixed;top:-12px;width:9px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}
</style>
</head>
<body>
<div class="phone">
  <div class="appbar" id="appbar" style="display:none">
    <button class="back" id="btnBack">←</button>
    <div class="titles"><h1 id="barTitle"></h1><div class="sub" id="barSub"></div></div>
    <button class="home" id="btnHome" title="Start over">⌂</button>
  </div>
  <div id="root"><div id="loading">Loading live data from Google Sheet…</div></div>
  <footer id="foot"></footer>
</div>
<script>
const SHEET_ID='1ztd-eO1eXg4sO6zwoLNPC8T833ffXWvu2PrZsU5kSzM', GID='593325688';
const U=n=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&`+n;
const MAIN_URL=U('gid='+GID), DAILY_URL=U('sheet='+encodeURIComponent('Daily Perf Data')),
      MIM_URL=U('sheet='+encodeURIComponent('MiM DAL')), ELB_URL=U('sheet='+encodeURIComponent('ELB Ranks'));
const REFRESH_MS=10*60*1000, OPEN_HOUR=10;
const NAMES=['New All','New Voice','HINT','BTS','MAGENTA'];
const DEALER_OVERRIDES={'MATLOCK':'Sid','I-20':'Sid'};
const ACCOUNTS={
  'FERGUSON':'BBC Wireless LLC','SAMUEL':'BBC Wireless LLC','WESTERN CENTER':'BBC Wireless LLC','ROSEDALE':'BBC Wireless LLC','BEACH WESTERN':'BBC Wireless LLC','HALTOM':'BBC Wireless LLC','ROUND GROVE':'BBC Wireless LLC',
  'NORTH MAIN':'Gig Enterprise LLC','SH-121':'Gig Enterprise LLC',
  'JACKSBORO':'Jacksboro Telecom, LLC','MIDWESTERN':'Jacksboro Telecom, LLC','SOUTHWEST':'Jacksboro Telecom, LLC',
  'LEWISVILLE':'Simple Solution Enterprise LLC',
  '6TH':'MBT Communication LLC','WEST PIONEER':'MBT Communication LLC','GREEN OAKS':'MBT Communication LLC','MATLOCK':'MBT Communication LLC','I-20':'MBT Communication LLC','FRANKFORD':'MBT Communication LLC','MONTFORT':'MBT Communication LLC','HARRY HINES':'MBT Communication LLC',
  'BELTLINE':'Ready to Be Picked, Inc.','MOTLEY':'Ready to Be Picked, Inc.','BROADWAY':'Ready to Be Picked, Inc.','FRONTAGE':'Ready to Be Picked, Inc.',
  'CAMP BOWIE':'Simple Solution Enterprise LLC','SYCAMORE':'Simple Solution Enterprise LLC',
  'DECATUR':'SMART 5G COMMUNICATION LLC','DENTON':'SMART 5G COMMUNICATION LLC'
};
const acctOf=st=>ACCOUNTS[st]||'';
function acctsOf(list){return [...new Set(list.map(s=>acctOf(s.store)).filter(Boolean))]}
const MKT_ABBR={'Express North Dallas':'N Dallas','Express South Dallas':'S Dallas','Express Fort Worth/West Texas':'FW / W TX'};
const ELB_CATS=[['Prepaid Phone Acts %',20,17,18],['BTS %',5,19,20],['HSI %',10,21,22],['MIM (Magenta)',20,23,24],['Feature $',10,25,26],['ACT Retention (95d)',10,27,28],['Feature Retention (95d)',10,29,30],['Flagged Activations',10,31,32],['CSAT',5,33,34]];
let model=null,daily=[],mim=null,elb=null;
// Read dealer lock from URL param (?dealer=NAME)
const URL_DEALER=decodeURIComponent((new URLSearchParams(window.location.search).get('dealer')||'').trim())||null;
let nav={screen:'role',role:null,dealer:URL_DEALER,store:null};

/* ---------- parsing ---------- */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else{
      if(ch==='"')q=true;
      else if(ch===','){row.push(cur);cur=''}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
      else if(ch!=='\r')cur+=ch;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
const num=s=>parseInt(String(s).replace(/[,$\s]/g,''),10)||0;
const pf=s=>parseFloat(String(s).replace(/[%$,\s]/g,''))||0;
function buildModel(rows){
  const meta={asOf:(rows[0]&&rows[0][19])||'',reportDate:rows[1][0],eom:rows[1][1],daysLeft:rows[1][2],
    paceFrac:(pf(rows[1][3])||40)/100};
  const stores=[];
  for(let i=3;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r[0]||!r[3])break;
    const goal=r.slice(6,11).map(num),mtd=r.slice(11,16).map(num),today=r.slice(16,21).map(num);
    const vari=r.slice(26,31).map(num),rem=r.slice(36,41).map(num);
    const pace=goal.map((g,j)=>{const t=Math.round(g*meta.paceFrac);return t>0?mtd[j]/t*100:0});
    const km=String(r[4]).match(/\(S\)\s*(.+)$/);
    stores.push({market:r[0].trim(),rdm:r[1].trim(),dealer:DEALER_OVERRIDES[r[3].trim()]||r[2].trim(),
      store:r[3].trim(),idKey:km?km[1].trim():r[3].trim(),goal,mtd,today,vari,rem,pace,
      qpayT:r[41],convT:r[42],qpayM:r[43],convM:r[44],featT:r[45],featM:r[46],topFeat:(r[51]||'').trim()});
  }
  return {meta,stores};
}
function buildDaily(rows){
  const recs=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r[0])continue;
    if(!r[1]&&!r[2])continue;
    const km=String(r[2]).match(/\(S\)\s*(.+)$/);
    recs.push({date:r[0].trim(),key:km?km[1].trim():null,
      vals:{0:num(r[5]),1:num(r[6]),2:num(r[29]),3:num(r[26])}});
  }
  return recs;
}
function buildMim(rows){
  const asOf=(rows[0]&&rows[0][2])||'';
  const byStore={};
  for(let i=2;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r[2]||!r[3])continue;
    byStore[r[2].trim()]={bans:num(r[5]),lines:num(r[6]),elig:num(r[8]),target:num(r[10])};
  }
  return {asOf,byStore};
}
function buildElb(rows){
  const asOf=(rows[1]&&rows[1][12])||'';
  const histDates=rows[2]?rows[2].slice(6,11).map(x=>x.trim()):[];
  const byStore={};
  for(let i=3;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r[4])continue;
    const cats=ELB_CATS.map(c=>({name:c[0],weight:c[1],rank:num(r[c[2]]),score:(r[c[3]]||'').trim()}));
    byStore[r[4].trim()]={hist:r.slice(6,11).map(num),rank:num(r[13]),score:(r[14]||'').trim(),
      quintile:(r[15]||'').trim(),cats};
  }
  return {asOf,histDates,byStore};
}
function parseMDY(s){const p=s.split('/');return new Date(+p[2],+p[0]-1,+p[1])}
const colorFor=p=>p>=100?'var(--green)':p>=70?'var(--amber)':'var(--red)';
const hexFor=p=>p>=100?'#16a34a':p>=70?'#d97706':'#dc2626';
const badgeFor=p=>p>=100?['on-pace','On Pace']:p>=70?['high','Needs Push']:['critical','Critical'];
const sign=n=>n>0?'+'+n:''+n;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const title=s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const initials=s=>s.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
function hoursOpen(){const n=new Date();return Math.max(0,(n-new Date(n.getFullYear(),n.getMonth(),n.getDate(),OPEN_HOUR))/36e5)}
const dayKey=()=>new Date().toDateString();

/* ---------- missions (memory + celebration) ---------- */
function loadMissions(){try{const m=JSON.parse(localStorage.getItem('umk_missions')||'{}');return m.day===dayKey()?m:{day:dayKey(),items:{}}}catch(e){return {day:dayKey(),items:{}}}}
function saveMissions(m){try{localStorage.setItem('umk_missions',JSON.stringify(m))}catch(e){}}
let missions=loadMissions();
function trackMission(id,text){
  if(!missions.items[id])missions.items[id]={text,done:false,celebrated:false};
  else missions.items[id].text=text;
}
function completeMission(id,winText){
  const it=missions.items[id];
  if(it&&!it.done){it.done=true;it.winText=winText}
}
/* dismissals: hidden for 2h after swipe/X — they come back if still unresolved */
const DISMISS_MS=2*60*60*1000;
function loadDismissed(){try{return JSON.parse(localStorage.getItem('umk_dismiss')||'{}')}catch(e){return {}}}
let dismissed=loadDismissed();
function isDismissed(id){return dismissed[id]&&(Date.now()-dismissed[id])<DISMISS_MS}
function dismissItem(id){
  dismissed[id]=Date.now();
  Object.keys(dismissed).forEach(k=>{if(Date.now()-dismissed[k]>DISMISS_MS)delete dismissed[k]});
  try{localStorage.setItem('umk_dismiss',JSON.stringify(dismissed))}catch(e){}
}
let confettiPending=false;
function fireConfetti(){
  const colors=['#e20074','#2563eb','#16a34a','#f59e0b','#a78bfa','#ef4444'];
  for(let i=0;i<90;i++){
    const d=document.createElement('div');d.className='cf';
    d.style.left=Math.random()*100+'vw';
    d.style.background=colors[i%colors.length];
    d.style.animationDuration=(2+Math.random()*2)+'s';
    d.style.animationDelay=(Math.random()*0.8)+'s';
    d.style.borderRadius=Math.random()>.5?'50%':'2px';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),5000);
  }
}

/* ---------- brief engine ---------- */
function storeBrief(s){
  const items=[],hrs=hoursOpen(),hr=Math.floor(hrs),dl=Math.max(+model.meta.daysLeft,1);
  const convT=pf(s.convT),qpayT=num(s.qpayT),nm=title(s.store);
  // conversion today
  if(hrs>=2&&qpayT>=5){
    const id=s.store+'|conv';
    if(convT<100){
      const lvl=convT<50?'crit':'warn';
      trackMission(id,`get ${nm} conversion over 100%`);
      const sales=Math.round(convT*qpayT/100);
      items.push({lvl,ic:lvl==='crit'?'🚨':'⚠️',store:s.store,id,
        t:`<b>${nm} — conversion ${convT.toFixed(0)}% on ${qpayT} QPAYs, ${hr}h since open.</b> ${qpayT-sales} walk-ins left without buying. Every payment is a pitch: upgrades, BTS, accessories. Goal is 100%+.`});
    }else{
      completeMission(id,`${nm} pushed conversion to ${convT.toFixed(0)}% — over 100%! That's how it's done. 🏆`);
      items.push({lvl:'win',ic:'🔥',store:s.store,id:id+'win',t:`<b>${nm} converting at ${convT.toFixed(0)}% today</b> (${qpayT} QPAYs) — above goal. Keep stacking.`});
    }
  }
  // nothing sold yet
  if(hrs>=3&&s.today.every(v=>!v)&&qpayT>0){
    const id=s.store+'|zero';
    trackMission(id,`${nm}: get on the board today`);
    items.push({lvl:'warn',ic:'🕐',store:s.store,id,t:`<b>${nm} — ${qpayT} customers in, zero sales logged, ${hr}h into the day.</b> First sale sets the tone. Attack the next walk-in.`});
  }else if(s.today.some(v=>v>0)){
    completeMission(s.store+'|zero',`${nm} is on the board today (+${s.today.reduce((a,b)=>a+b,0)}) — momentum started! 🎉`);
  }
  // pace gap (worst metric)
  let wi=-1,wv=0;
  s.vari.forEach((v,i)=>{if(v<wv){wv=v;wi=i}});
  if(wi>=0){
    const id=s.store+'|pace'+wi;
    trackMission(id,`${nm}: close the ${NAMES[wi]} pace gap`);
    const need=Math.ceil(s.rem[wi]/dl);
    const lvl=s.pace[wi]<70?'crit':'warn';
    items.push({lvl,ic:lvl==='crit'?'🚨':'📉',store:s.store,id,
      t:`<b>${nm} — ${NAMES[wi]} is ${-wv} behind pace</b> (${s.pace[wi].toFixed(0)}% on-target). ${s.rem[wi]} to go in ${dl} days = ${need}/day. Close ${Math.min(-wv,need)} today to stop the bleed.`});
  }
  s.vari.forEach((v,i)=>{if(v>=0)completeMission(s.store+'|pace'+i,`${title(s.store)} is back ON PACE for ${NAMES[i]} (${sign(v)})! Gap closed. 🎉`)});
  // MiM
  if(mim){
    const x=mim.byStore[s.store];
    if(x&&x.target>0){
      const pct=x.lines/x.target*100,id=s.store+'|mim';
      if(pct<40){

        items.push({lvl:pct<20?'crit':'warn',ic:'🧲',store:s.store,id,
          t:`<b>${nm} — MiM at ${x.lines}/${x.target} (${pct.toFixed(0)}%).</b> ${Math.max(x.elig-x.bans,0)} eligible BANs are sitting unconverted. Pitch Magenta on every eligible account today.`});
      }else completeMission(id,`${title(s.store)} MiM is over 40% of target (${pct.toFixed(0)}%) — Magenta machine! 🧲🎉`);
    }
  }
  // ELB
  if(elb){
    const e=elb.byStore[s.store];
    if(e){
      const h=e.hist.filter(x=>x>0);
      if(h.length>=2){
        const d=h[h.length-1]-h[h.length-2];
        if(d<=-300)items.push({lvl:'win',ic:'🚀',store:s.store,id:s.store+'|elbup',t:`<b>${nm} jumped ${-d} spots on the ELB</b> — now #${e.rank} nationally (${esc(e.quintile)}). Momentum is real.`});
        else if(d>=300)items.push({lvl:'warn',ic:'📉',store:s.store,id:s.store+'|elbdn',t:`<b>${nm} slipped ${d} spots on the ELB</b> to #${e.rank} (${esc(e.quintile)}). Check the category drags below and pick one to fix today.`});
      }
      if(/bottom/i.test(e.quintile))items.push({lvl:'crit',ic:'🆘',store:s.store,id:s.store+'|elbbottom',t:`<b>${nm} is in the ELB Bottom 20% nationally (#${e.rank}).</b> This is the hole to climb out of — every category point counts.`});
      e.cats.forEach(c=>{
        if(c.weight>=10&&pf(c.score)===0&&!/csat/i.test(c.name))
          items.push({lvl:'crit',ic:'🎯',store:s.store,id:s.store+'|cat'+c.name,t:`<b>${nm} — ${esc(c.name)} is at 0%</b> and it's worth ${c.weight}% of the ELB score. One sale here moves the whole rank.`});
      });
    }
  }
  return items;
}
function briefFor(list){
  let items=[];
  list.forEach(s=>{items=items.concat(storeBrief(s))});
  // aggregate conversion for multi-store views
  if(list.length>1){
    const hrs=hoursOpen();
    let qp=0,sales=0;
    list.forEach(s=>{const q=num(s.qpayT);qp+=q;sales+=Math.round(pf(s.convT)*q/100)});
    if(hrs>=2&&qp>=10){
      const cv=sales/qp*100;
      if(cv<100)items.unshift({lvl:cv<50?'crit':'warn',ic:'🧮',store:'__agg__',id:'__agg__|conv',
        t:`<b>Team conversion is ${cv.toFixed(0)}% today</b> — ${sales} sales on ${qp} QPAYs, ${Math.floor(hrs)}h since open. ${qp-sales} customers walked without buying. Goal: 100%+.`});
      else items.unshift({lvl:'win',ic:'🔥',store:'__agg__',id:'__agg__|convwin',t:`<b>Team converting at ${cv.toFixed(0)}% today</b> (${sales}/${qp} QPAYs) — above goal across the board.`});
    }
  }
  // celebrations from completed missions
  const wins=[];
  Object.keys(missions.items).forEach(id=>{
    const it=missions.items[id];
    const st=id.split('|')[0];
    const inScope=st==='__agg__'||list.some(s=>s.store===st);
    if(it.done&&inScope){
      wins.push({lvl:'party',ic:'🎉',id:'party|'+id,t:`<b>MISSION COMPLETE:</b> ${esc(it.winText||it.text)}`});
      if(!it.celebrated){it.celebrated=true;confettiPending=true}
    }
  });
  saveMissions(missions);
  const order={party:0,crit:1,warn:2,win:3};
  items=wins.concat(items.sort((a,b)=>order[a.lvl]-order[b.lvl]));
  return items.filter(i=>!isDismissed(i.id)).slice(0,9);
}
function briefHTML(list){

function attachBriefHandlers(){
  document.querySelectorAll('.bitem').forEach(el=>{
    const id=el.dataset.bid;
    if(!id)return;
    const remove=()=>{el.classList.add('gone');setTimeout(()=>{dismissItem(id);el.remove()},220)};
    el.querySelector('.bx').addEventListener('click',e=>{e.stopPropagation();remove()});
    let sx=null,dx=0;
    el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0;el.style.transition='none'},{passive:true});
    el.addEventListener('touchmove',e=>{
      if(sx===null)return;
      dx=e.touches[0].clientX-sx;
      el.style.transform=`translateX(${dx}px)`;
      el.style.opacity=String(Math.max(1-Math.abs(dx)/240,.3));
    },{passive:true});
    el.addEventListener('touchend',()=>{
      el.style.transition='';
      if(Math.abs(dx)>80){
        el.style.transform=`translateX(${dx>0?'110%':'-110%'})`;el.style.opacity='0';
        setTimeout(()=>{dismissItem(id);el.remove()},220);
      }else{el.style.transform='';el.style.opacity=''}
      sx=null;
    });
  });
}

/* ---------- series + spark ---------- */
function seriesFor(subset,m){
  const meta=model.meta;
  const start=parseMDY(meta.reportDate);start.setDate(1);
  const nDays=parseMDY(meta.eom).getDate();
  const goalTotal=subset.reduce((t,s)=>t+s.goal[m],0);
  const mtd=subset.reduce((t,s)=>t+s.mtd[m],0);
  const goalLine=[];for(let i=0;i<nDays;i++)goalLine.push(goalTotal*(i+1)/nDays);
  const keys=new Set(subset.map(s=>s.idKey));
  const dayMap={};
  daily.forEach(r=>{if(r.key&&keys.has(r.key))dayMap[r.date]=(dayMap[r.date]||0)+r.vals[m]});
  const idxOf=dt=>Math.round((parseMDY(dt)-start)/864e5);
  const dates=Object.keys(dayMap).filter(d=>{const i=idxOf(d);return i>=0&&i<nDays}).sort((a,b)=>parseMDY(a)-parseMDY(b));
  const cum=new Array(nDays).fill(null);
  if(dates.length){
    let run=mtd-dates.reduce((t,d)=>t+dayMap[d],0);
    const f=idxOf(dates[0]);if(f-1>=0)cum[f-1]=run;
    dates.forEach(dt=>{run+=dayMap[dt];cum[idxOf(dt)]=run});
  }
  const todayIdx=parseMDY(meta.reportDate).getDate()-1;
  return {nDays,goalTotal,mtd,goalLine,cum,todayIdx,paceTarget:goalLine[todayIdx]};
}
function sparkSVG(se,h=120){
  const W=480,H=h,L=8,R=8,T=12,B=8,pw=W-L-R,ph=H-T-B;
  const yMax=Math.max(se.goalTotal,...se.cum.filter(v=>v!=null),1)*1.08;
  const X=i=>L+pw*(i+.5)/se.nDays, Y=v=>T+ph*(1-v/yMax);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${h}px" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<line x1="${X(se.todayIdx)}" y1="${T}" x2="${X(se.todayIdx)}" y2="${T+ph}" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/>`;
  s+=`<polyline fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" points="${se.goalLine.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
  const pts=[];se.cum.forEach((v,i)=>{if(v!=null)pts.push([X(i),Y(v),v,i+1])});
  if(pts.length){
    const col=se.mtd>=se.paceTarget?'#16a34a':'#dc2626';
    s+=`<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
    pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${col}"><title>Day ${p[3]}: ${p[2]} cumulative</title></circle>`});
  }
  return s+'</svg>';
}
function rankSpark(hist,dates,h=90){
  const W=480,H=h,L=10,R=10,T=14,B=16,pw=W-L-R,ph=H-T-B;
  const vals=hist.filter(v=>v>0);
  if(vals.length<2)return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),span=Math.max(mx-mn,1);
  const X=i=>L+pw*i/(hist.length-1), Y=v=>T+ph*((v-mn)/span); // lower rank = better = higher on chart? invert: lower rank → top
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${h}px" xmlns="http://www.w3.org/2000/svg">`;
  const pts=[];hist.forEach((v,i)=>{if(v>0)pts.push([X(i),Y(v),v,dates[i]||''])});
  const improving=pts[pts.length-1][2]<=pts[0][2];
  const col=improving?'#16a34a':'#dc2626';
  s+=`<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
  pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${col}"><title>${p[3]}: #${p[2].toLocaleString()}</title></circle>
    <text x="${p[0]}" y="${H-3}" text-anchor="middle" font-size="9" fill="#64748b">${p[3].replace('/2026','')}</text>`});
  s+=`<text x="${pts[pts.length-1][0]}" y="${pts[pts.length-1][1]-7}" text-anchor="end" font-size="10" font-weight="700" fill="${col}">#${pts[pts.length-1][2].toLocaleString()}</text>`;
  return s+'</svg>'+`<div style="font-size:.66rem;color:var(--muted);text-align:center">national rank — lower is better (chart: down = better)</div>`;
}

function elbPanel(s){
  if(!elb)return '';
  const e=elb.byStore[s.store];
  if(!e)return '';
  const h=e.hist.filter(x=>x>0);
  const d=h.length>=2?h[h.length-1]-h[h.length-2]:0;
  const ch=d<0?`<span class="chg up">▲ ${-d} vs prev day</span>`:d>0?`<span class="chg dn">▼ ${d} vs prev day</span>`:'<span class="chg flat">no change</span>';
  const qcls=/top/i.test(e.quintile)?'qtop':/bottom/i.test(e.quintile)?'qbad':'q';
  let cats='';
  e.cats.forEach(c=>{
    cats+=`<div class="cat"><span class="cn">${esc(c.name)}</span><span class="w">${c.weight}%</span>
      <span class="cr">#${c.rank.toLocaleString()}</span><span class="cs" style="color:${catColor(c)}">${esc(c.score)}</span></div>`;
  });
  return `<div class="panel" style="border-left:3px solid var(--blue)"><h3 style="color:var(--blue)">🏆 ELB — Elite Leader Board · as of ${esc(elb.asOf)}</h3>
    <div class="elb-top">
      <div><div class="elb-rank">#${e.rank.toLocaleString()}</div><div class="elb-meta">national rank</div></div>
      <div class="elb-meta">${ch}<br>Overall score <b style="color:var(--text)">${esc(e.score)}</b> · <span class="badge ${qcls}">${esc(e.quintile)}</span></div>
    </div>
    ${rankSpark(e.hist,elb.histDates)}
    <div style="margin-top:10px">${cats}</div>
  </div>`;
}
function mimPanel(s){
  if(!mim)return '';
  const x=mim.byStore[s.store];
  if(!x)return '';
  const pct=x.target?x.lines/x.target*100:0;
  const conv=x.elig?x.bans/x.elig*100:0;
  return `<div class="panel" style="border-left:3px solid var(--magenta)"><h3 style="color:var(--magenta)">MiM — Magenta in Metro · as of ${esc(mim.asOf)}</h3>
    <div class="met">
      <div class="top"><span class="nm">Lines vs Postpaid Target</span><span class="nums"><b>${x.lines}</b>/${x.target}<span class="pc" style="color:var(--magenta)">${pct.toFixed(0)}%</span></span></div>
      <div class="bar"><div class="fill" style="background:var(--magenta);width:${Math.min(pct,100).toFixed(1)}%"></div></div>
    </div>
    <div class="statline"><span>MiM BANs / Eligible</span><b>${x.bans} / ${x.elig}</b></div>
    <div class="statline"><span>Eligible BAN conversion</span><b>${conv.toFixed(1)}%</b></div>
  </div>`;
}
function screenDetail(){
  const s=model.stores.find(x=>x.store===nav.store);
  if(!s)return '<div class="screen"><div class="err">Store not found — data may have changed. Go back and re-select.</div></div>';
  const [cls,lbl]=badgeFor(s.pace[0]);
  const se=seriesFor([s],0);
  let mets='';
  NAMES.forEach((n,i)=>{
    const p=s.pace[i],col=colorFor(p);
    mets+=`<div class="met">
      <div class="top"><span class="nm">${n}</span><span class="nums"><b>${s.mtd[i]}</b>/${s.goal[i]}${s.today[i]?` · <b style="color:var(--blue)">${sign(s.today[i])} today</b>`:''}<span class="pc" style="color:${col}">${p.toFixed(0)}%</span></span></div>
      <div class="bar"><div class="fill" style="background:${col};width:${Math.min(p,100).toFixed(1)}%"></div></div>
      <div class="foot"><span>Δ pace ${sign(s.vari[i])}</span><span>${s.rem[i]} to go</span></div>
    </div>`;
  });
  let feat=`${s.featM}/box MTD`;
  if(s.featT&&!/^\$\s*0(\.00)?\s*$|^\$\s*-/.test(s.featT.trim()))feat+=` · ${s.featT} today`;
  const e=elb&&elb.byStore[s.store];
  let elbHead='';
  if(e){
    const hh=e.hist.filter(x=>x>0);
    const d=hh.length>=2?hh[hh.length-2]-hh[hh.length-1]:0;
    elbHead=`<div class="bigpct"><span class="n" style="color:${rankColor(e.rank)}">#${e.rank.toLocaleString()}</span>
      <span class="d">ELB national rank ${moveHTML(d)} · ${esc(e.quintile)} · score ${esc(e.score)}</span></div>`;
  }
  return `<div class="screen">
    ${briefHTML([s])}
    <div class="det-head">
      <div class="row1"><h2>📍 ${esc(title(s.store))}</h2><span class="badge ${cls}">${lbl}</span></div>
      <div class="who">${acctOf(s.store)?esc(acctOf(s.store))+' · ':''}${esc(s.dealer)} · ${esc(MKT_ABBR[s.market]||s.market)} · RDM ${esc(s.rdm)}</div>
      ${elbHead}
      <div style="font-size:.78rem;color:var(--muted);margin-top:8px"><b style="color:${colorFor(s.pace[0])}">${s.pace[0].toFixed(0)}%</b> of New All pace target · ${s.mtd[0]}/${s.goal[0]} goal · ${s.rem[0]} to go in ${model.meta.daysLeft} days</div>
    </div>
    ${elbPanel(s)}
    <div class="panel"><h3>New All — month trend vs goal pace</h3>${sparkSVG(se,120)}</div>
    <div class="panel"><h3>Metrics month-to-date</h3>${mets}</div>
    ${mimPanel(s)}
    <div class="panel"><h3>Conversion & features</h3>
      <div class="statline"><span>Conversion MTD</span><b>${esc(s.convM)} <span style="color:var(--muted);font-weight:400">(${esc(s.qpayM)} QPAY)</span></b></div>
      <div class="statline"><span>Conversion today</span><b>${esc(s.convT)} <span style="color:var(--muted);font-weight:400">(${esc(s.qpayT)} QPAY)</span></b></div>
      <div class="statline"><span>Feature revenue</span><b>${esc(feat)}</b></div>
      ${s.topFeat?`<div class="statline"><span>Top feature</span><b>${esc(s.topFeat)}</b></div>`:''}
    </div>
    ${liveBar()}
  </div>`;
}
const fmtAsOf=s=>{if(!s)return'';const m=s.match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+)/);if(!m)return s;let h=+m[4],mi=m[5],ap=h>=12?'pm':'am';h=h%12||12;return`${m[1]}/${m[2]}/${m[3]} ${h}:${mi}${ap}`};
function liveBar(){
  return `<div class="livebar"><span class="pulse"></span><span>Live · sheet as of ${fmtAsOf(model?model.meta.asOf:'')} · refreshes every 10 min</span></div>`;
}
function screenLinks(){
  const base=window.location.origin+window.location.pathname;
  let h=`<div class="screen"><div class="list-title" style="margin-top:0">Sub-Dealer Links</div>
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:14px">Each link opens a version of the app locked to that sub-dealer. Share directly with your reps.</p>`;
  dealersList().forEach(d=>{
    const url=base+'?dealer='+encodeURIComponent(d.name);
    const accts=acctsOf(d.stores);
    h+=`<div class="item" style="flex-direction:column;align-items:flex-start;gap:6px;cursor:default">
      <div style="display:flex;align-items:center;gap:10px;width:100%">
        <span class="av">${initials(d.name)}</span>
        <span class="info"><h3>${esc(d.name)}</h3><p>${accts.length?esc(accts.join(' · ')):''}${accts.length?' · ':''} ${d.stores.length} store${d.stores.length!==1?'s':''}</p></span>
      </div>
      <div style="display:flex;gap:8px;width:100%;align-items:center">
        <input readonly value="${esc(url)}" onclick="this.select()" style="flex:1;font-size:.68rem;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--track);color:var(--muted);min-width:0">
        <button onclick="navigator.clipboard.writeText('${esc(url)}').then(()=>{this.textContent='✓ Copied';setTimeout(()=>this.textContent='Copy',1500)})" style="font-size:.72rem;padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;flex-shrink:0">Copy</button>
      </div>
    </div>`;
  });
  return h+'</div>';
}

function renderApp(){
  if(!model)return;
  const root=document.getElementById('root');
  const bar=document.getElementById('appbar');
  const tEl=document.getElementById('barTitle'),sEl=document.getElementById('barSub');
  if(nav.screen==='role'){bar.style.display='none';root.innerHTML=screenRole()}
  else{
    bar.style.display='flex';
    const dn=nav.dealer==='__all__'?'All Sub-Dealers':nav.dealer;
    if(nav.screen==='dealer'){tEl.textContent=nav.role==='manager'?'Manager':'Employee';sEl.textContent='Select sub-dealer';root.innerHTML=screenDealer()}
    if(nav.screen==='dash'){tEl.textContent=dn;sEl.textContent='Manager dashboard · '+storesOf().length+' stores';root.innerHTML=screenDash()}
    if(nav.screen==='stores'){tEl.textContent=dn;sEl.textContent='Choose your store';root.innerHTML=screenStores()}
    if(nav.screen==='detail'){tEl.textContent=title(nav.store||'');sEl.textContent=dn+' · store detail';root.innerHTML=screenDetail()}
    if(nav.screen==='links'){tEl.textContent='Sub-Dealer Links';sEl.textContent='';root.innerHTML=screenLinks()}
  }
  document.getElementById('foot').textContent='Tomorrow Telecom · Month-To-Date Perf + MiM DAL + ELB Ranks (Google Sheet) · '+(model.meta.paceFrac*100).toFixed(0)+'% through month';
  attachBriefHandlers();
  if(confettiPending){confettiPending=false;fireConfetti()}
}
document.getElementById('btnBack').addEventListener('click',()=>{const t=backTarget();if(t)go(t)});
document.getElementById('btnHome').addEventListener('click',()=>go({screen:'role',role:null,dealer:null,store:null}));

async function loadData(){
  try{
    const fs=await Promise.all([
      fetch(MAIN_URL+'&t='+Date.now(),{cache:'no-store'}),
      fetch(DAILY_URL+'&t='+Date.now(),{cache:'no-store'}),
      fetch(MIM_URL+'&t='+Date.now(),{cache:'no-store'}).catch(()=>null),
      fetch(ELB_URL+'&t='+Date.now(),{cache:'no-store'}).catch(()=>null)
    ]);
    if(fs[0]&&fs[0].ok){
      const m=buildModel(parseCSV(await fs[0].text()));
      if(m.stores.length)model=m;
    }
    if(fs[1]&&fs[1].ok)daily=buildDaily(parseCSV(await fs[1].text()));
    if(fs[2]&&fs[2].ok){const x=buildMim(parseCSV(await fs[2].text()));if(Object.keys(x.byStore).length)mim=x}
    if(fs[3]&&fs[3].ok){const x=buildElb(parseCSV(await fs[3].text()));if(Object.keys(x.byStore).length)elb=x}
    if(model)renderApp();
    else document.getElementById('root').innerHTML='<div class="screen"><div class="err">Could not load data from the Google Sheet. Check your connection and reload.</div></div>';
  }catch(e){
    if(!model)document.getElementById('root').innerHTML='<div class="screen"><div class="err">Could not load data from the Google Sheet. Check your connection and reload.</div></div>';
  }
}
loadData();
setInterval(loadData,REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadData()});
</script>
